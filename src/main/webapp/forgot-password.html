<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Recovery – CouponLoop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-center bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="text-center mb-4">
                    <a href="index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none">
                        <div class="brand-icon"><i class="fa-solid fa-arrows-rotate"></i></div>
                        <span class="fs-3 fw-bold text-dark">Coupon<span class="text-primary">Loop</span></span>
                    </a>
                    <h5 class="fw-bold mt-3 mb-1">Reset Your Password</h5>
                    <p class="text-muted small">Enter your account email to receive demo recovery credentials.</p>
                </div>

                <div class="card-loop p-4 p-md-5">
                    <!-- Step 1: Request Reset Token -->
                    <div id="step-request-box">
                        <form onsubmit="handleRequestReset(event)">
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Registered Email</label>
                                <input type="email" id="reset-req-email" class="form-control" placeholder="name@example.com" required>
                            </div>
                            <div id="request-alert" class="alert d-none small mb-3"></div>
                            <button type="submit" id="request-btn" class="btn btn-primary w-100 py-2.5 shadow-sm">
                                <i class="fa-solid fa-paper-plane me-1"></i> Send Recovery Token
                            </button>
                        </form>
                    </div>

                    <!-- Step 2: Set New Password -->
                    <div id="step-reset-box" class="d-none">
                        <div class="p-2.5 bg-success-subtle border border-success-subtle rounded-3 small text-success mb-3">
                            <i class="fa-solid fa-circle-check me-1"></i> Verification code simulated for development: <strong id="token-display">TOKEN</strong>
                        </div>
                        <form onsubmit="handleSetNewPassword(event)">
                            <div class="mb-3">
                                <label class="form-label small fw-bold">New Password</label>
                                <input type="password" id="new-password" class="form-control" placeholder="••••••••" minlength="6" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label small fw-bold">Confirm New Password</label>
                                <input type="password" id="confirm-new-password" class="form-control" placeholder="••••••••" minlength="6" required>
                            </div>
                            <div id="reset-alert" class="alert d-none small mb-3"></div>
                            <button type="submit" id="reset-btn" class="btn btn-primary w-100 py-2.5 shadow-sm">
                                Update Password
                            </button>
                        </form>
                    </div>

                    <div class="text-center mt-3 small">
                        <a href="login.html" class="text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Back to Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
        let targetEmail = '';

        async function handleRequestReset(e) {
            e.preventDefault();
            const email = document.getElementById('reset-req-email').value.trim();
            const alertBox = document.getElementById('request-alert');
            const btn = document.getElementById('request-btn');

            alertBox.classList.add('d-none');
            btn.disabled = true;

            try {
                const res = await API.auth.forgotPassword(email);
                if (res.success) {
                    targetEmail = email;
                    document.getElementById('step-request-box').classList.add('d-none');
                    document.getElementById('step-reset-box').classList.remove('d-none');
                    document.getElementById('token-display').innerText = (res.data && res.data.simulatedToken) ? res.data.simulatedToken : 'VERIFIED';
                    App.showToast("Reset token generated!", "success");
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger small';
                alertBox.innerText = err.message || 'Error requesting reset.';
                alertBox.classList.remove('d-none');
                btn.disabled = false;
            }
        }

        async function handleSetNewPassword(e) {
            e.preventDefault();
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-new-password').value;
            const alertBox = document.getElementById('reset-alert');
            const btn = document.getElementById('reset-btn');

            alertBox.classList.add('d-none');

            if (newPassword !== confirmPassword) {
                alertBox.className = 'alert alert-danger small';
                alertBox.innerText = 'Passwords do not match.';
                alertBox.classList.remove('d-none');
                return;
            }

            btn.disabled = true;
            try {
                const res = await API.auth.resetPassword({
                    email: targetEmail,
                    newPassword,
                    confirmPassword
                });

                if (res.success) {
                    alertBox.className = 'alert alert-success small';
                    alertBox.innerText = res.message;
                    alertBox.classList.remove('d-none');
                    App.showToast("Password updated successfully!", "success");
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 1200);
                } else {
                    alertBox.className = 'alert alert-danger small';
                    alertBox.innerText = res.message;
                    alertBox.classList.remove('d-none');
                    btn.disabled = false;
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger small';
                alertBox.innerText = err.message || 'Reset failed.';
                alertBox.classList.remove('d-none');
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
