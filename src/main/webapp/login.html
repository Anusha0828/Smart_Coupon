<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – CouponLoop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-center bg-light">

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-7 col-lg-5">
                <div class="text-center mb-4">
                    <a href="index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none">
                        <div class="brand-icon"><i class="fa-solid fa-arrows-rotate"></i></div>
                        <span class="fs-3 fw-bold text-dark">Coupon<span class="text-primary">Loop</span></span>
                    </a>
                    <p class="text-muted small mt-2">Welcome back! Sign in to access your vouchers & wallet.</p>
                </div>

                <div class="card-loop p-4 p-md-5">
                    <!-- Demo Credentials Quick-Fill Badges -->
                    <div class="p-3 bg-light rounded-3 border mb-4">
                        <div class="small fw-bold text-muted mb-2"><i class="fa-solid fa-key text-warning me-1"></i> Quick Demo Sign-In:</div>
                        <div class="d-flex flex-wrap gap-2">
                            <button type="button" class="btn btn-sm btn-outline-danger py-1 px-2.5" onclick="fillDemo('admin@couponloop.com', 'Admin@123')">Admin</button>
                            <button type="button" class="btn btn-sm btn-outline-primary py-1 px-2.5" onclick="fillDemo('rahul.seller@gmail.com', 'Seller@123')">Seller</button>
                            <button type="button" class="btn btn-sm btn-outline-success py-1 px-2.5" onclick="fillDemo('priya.buyer@gmail.com', 'Buyer@123')">Buyer</button>
                        </div>
                    </div>

                    <form id="login-form" onsubmit="handleLoginSubmit(event)">
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fa-regular fa-envelope text-muted"></i></span>
                                <input type="email" id="login-email" class="form-control" placeholder="name@example.com" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <label class="form-label small fw-bold mb-0">Password</label>
                                <a href="forgot-password.html" class="small text-primary text-decoration-none">Forgot Password?</a>
                            </div>
                            <div class="input-group mt-1">
                                <span class="input-group-text bg-white"><i class="fa-solid fa-lock text-muted"></i></span>
                                <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                                <button type="button" class="btn btn-outline-secondary" onclick="togglePasswordVisibility('login-password')">
                                    <i class="fa-regular fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div id="login-alert" class="alert d-none small mb-3"></div>

                        <button type="submit" id="login-submit-btn" class="btn btn-primary w-100 py-2.5 shadow-sm mb-3">
                            <i class="fa-solid fa-arrow-right-to-bracket me-2"></i>Sign In
                        </button>

                        <div class="text-center small text-muted">
                            Don't have an account? <a href="register.html" class="fw-bold text-primary text-decoration-none">Create an Account</a>
                        </div>
                    </form>
                </div>

                <div class="text-center mt-4 small text-muted">
                    <a href="index.html" class="text-decoration-none text-muted"><i class="fa-solid fa-arrow-left me-1"></i> Back to Homepage</a>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
        function fillDemo(email, pwd) {
            document.getElementById('login-email').value = email;
            document.getElementById('login-password').value = pwd;
        }

        function togglePasswordVisibility(id) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
        }

        async function handleLoginSubmit(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;
            const alertBox = document.getElementById('login-alert');
            const submitBtn = document.getElementById('login-submit-btn');

            alertBox.classList.add('d-none');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Authenticating...';

            try {
                const res = await API.auth.login(email, password);
                if (res.success) {
                    App.showToast(res.message, "success");
                    const urlParams = new URLSearchParams(window.location.search);
                    const redirect = urlParams.get('redirect');

                    setTimeout(() => {
                        if (redirect) {
                            window.location.href = redirect;
                        } else if (res.data && res.data.isAdmin) {
                            window.location.href = 'admin-dashboard.html';
                        } else if (res.data && res.data.role === 'SELLER') {
                            window.location.href = 'seller-dashboard.html';
                        } else {
                            window.location.href = 'browse.html';
                        }
                    }, 800);
                } else {
                    alertBox.className = 'alert alert-danger small';
                    alertBox.innerText = res.message;
                    alertBox.classList.remove('d-none');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket me-2"></i>Sign In';
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger small';
                alertBox.innerText = err.message || 'Login failed. Please check credentials.';
                alertBox.classList.remove('d-none');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-arrow-right-to-bracket me-2"></i>Sign In';
            }
        }
    </script>
</body>
</html>
