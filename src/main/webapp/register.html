<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account – CouponLoop</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex flex-column min-vh-100 justify-content-center bg-light py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="text-center mb-4">
                    <a href="index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none">
                        <div class="brand-icon"><i class="fa-solid fa-arrows-rotate"></i></div>
                        <span class="fs-3 fw-bold text-dark">Coupon<span class="text-primary">Loop</span></span>
                    </a>
                    <p class="text-muted small mt-2">Join India's trusted marketplace for transferable promotional vouchers.</p>
                </div>

                <div class="card-loop p-4 p-md-5">
                    <form id="register-form" onsubmit="handleRegisterSubmit(event)">
                        
                        <div class="mb-3">
                            <label class="form-label small fw-bold">Full Name <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-white"><i class="fa-regular fa-user text-muted"></i></span>
                                <input type="text" id="reg-name" class="form-control" placeholder="e.g. Anusha Kasani" required>
                            </div>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-md-7">
                                <label class="form-label small fw-bold">Email Address <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="fa-regular fa-envelope text-muted"></i></span>
                                    <input type="email" id="reg-email" class="form-control" placeholder="name@example.com" required>
                                </div>
                            </div>
                            <div class="col-md-5">
                                <label class="form-label small fw-bold">Mobile Number <span class="text-danger">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text bg-white"><i class="fa-solid fa-phone text-muted"></i></span>
                                    <input type="tel" id="reg-mobile" class="form-control" placeholder="9876543210" pattern="[6-9][0-9]{9}" required>
                                </div>
                            </div>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Password (min 6 chars) <span class="text-danger">*</span></label>
                                <input type="password" id="reg-password" class="form-control" placeholder="••••••••" minlength="6" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold">Confirm Password <span class="text-danger">*</span></label>
                                <input type="password" id="reg-confirm-password" class="form-control" placeholder="••••••••" minlength="6" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold">Primary Account Role</label>
                            <div class="d-flex gap-3">
                                <label class="flex-grow-1 p-2.5 border rounded-3 text-center cursor-pointer bg-white">
                                    <input type="radio" name="reg-role" value="BUYER" checked class="form-check-input me-1">
                                    <span class="small fw-semibold">Buyer (Discover Deals)</span>
                                </label>
                                <label class="flex-grow-1 p-2.5 border rounded-3 text-center cursor-pointer bg-white">
                                    <input type="radio" name="reg-role" value="SELLER" class="form-check-input me-1">
                                    <span class="small fw-semibold">Seller (Monetize Vouchers)</span>
                                </label>
                            </div>
                            <div class="form-text text-muted" style="font-size:0.75rem;">You can act as both buyer and seller seamlessly from a single unified profile.</div>
                        </div>

                        <div id="reg-alert" class="alert d-none small mb-3"></div>

                        <button type="submit" id="reg-submit-btn" class="btn btn-primary w-100 py-2.5 shadow-sm mb-3">
                            <i class="fa-solid fa-user-plus me-2"></i>Create Free Account
                        </button>

                        <div class="text-center small text-muted">
                            Already registered? <a href="login.html" class="fw-bold text-primary text-decoration-none">Sign In Here</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/app.js"></script>
    <script>
        async function handleRegisterSubmit(e) {
            e.preventDefault();
            const fullName = document.getElementById('reg-name').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const mobile = document.getElementById('reg-mobile').value.trim();
            const password = document.getElementById('reg-password').value;
            const confirmPassword = document.getElementById('reg-confirm-password').value;
            const role = document.querySelector('input[name="reg-role"]:checked').value;

            const alertBox = document.getElementById('reg-alert');
            const submitBtn = document.getElementById('reg-submit-btn');

            alertBox.classList.add('d-none');

            if (password !== confirmPassword) {
                alertBox.className = 'alert alert-danger small';
                alertBox.innerText = 'Passwords do not match.';
                alertBox.classList.remove('d-none');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Registering...';

            try {
                const res = await API.auth.register({
                    fullName,
                    email,
                    mobile,
                    password,
                    confirmPassword,
                    role
                });

                if (res.success) {
                    App.showToast("Registration successful!", "success");
                    alertBox.className = 'alert alert-success small';
                    alertBox.innerText = res.message;
                    alertBox.classList.remove('d-none');
                    setTimeout(() => {
                        window.location.href = role === 'SELLER' ? 'seller-dashboard.html' : 'browse.html';
                    }, 1000);
                } else {
                    alertBox.className = 'alert alert-danger small';
                    alertBox.innerText = res.message;
                    alertBox.classList.remove('d-none');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fa-solid fa-user-plus me-2"></i>Create Free Account';
                }
            } catch (err) {
                alertBox.className = 'alert alert-danger small';
                alertBox.innerText = err.message || 'Registration failed.';
                alertBox.classList.remove('d-none');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-user-plus me-2"></i>Create Free Account';
            }
        }
    </script>
</body>
</html>
